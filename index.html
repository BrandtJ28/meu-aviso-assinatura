<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Pay - Gestor com Horário</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        .container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #e63946; text-align: center; }
        label { font-size: 12px; font-weight: bold; color: #666; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #e63946; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .lista { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
        .item { background: #fff5f5; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #e63946; position: relative; }
        .btn-excluir { background: #ff4d4d; width: auto; padding: 5px 10px; font-size: 11px; margin-top: 5px; }
        .btn-editar { background: #ffb330; width: auto; padding: 5px 10px; font-size: 11px; margin-right: 5px; }
        .controles { display: flex; justify-content: flex-end; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚫 Stop Pay</h2>
    
    <input type="hidden" id="idEdicao"> <label>Serviço:</label>
    <input type="text" id="servico" placeholder="Ex: Netflix">
    
    <label>Data de Vencimento:</label>
    <input type="date" id="dataVenc">
    
    <label>Horário do Alerta (Relógio):</label>
    <input type="time" id="horaAlerta" value="09:00">
    
    <button id="btnSalvar">Agendar Alerta</button>

    <div class="lista" id="listaAssinaturas">
        <h3>Minhas Assinaturas:</h3>
        <div id="itensFirebase">Carregando...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvb_5kfqZ0TcvqqXYJ3H0zje7lkxg5KT0",
      authDomain: "stop-pay.firebaseapp.com",
      projectId: "stop-pay",
      storageBucket: "stop-pay.firebasestorage.app",
      messagingSenderId: "924558165559",
      appId: "1:924558165559:web:f9cf09b70071bac7e7e1b2",
      measurementId: "G-FVRE5N3LGL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function salvar() {
        const id = document.getElementById('idEdicao').value;
        const nome = document.getElementById('servico').value;
        const data = document.getElementById('dataVenc').value;
        const hora = document.getElementById('horaAlerta').value;

        if(!nome || !data || !hora) return alert("Preencha todos os campos!");

        try {
            if(id) {
                // Modo Edição
                await updateDoc(doc(db, "assinaturas", id), {
                    nome: nome,
                    dataVencimento: data,
                    horaAlerta: hora
                });
                document.getElementById('idEdicao').value = "";
                document.getElementById('btnSalvar').innerText = "Agendar Alerta";
            } else {
                // Modo Criação
                await addDoc(collection(db, "assinaturas"), {
                    nome: nome,
                    dataVencimento: data,
                    horaAlerta: hora,
                    criadoEm: new Date().toISOString()
                });
            }
            limparCampos();
            exibirAssinaturas();
        } catch (e) { alert("Erro ao salvar!"); }
    }

    async function exibirAssinaturas() {
        const listaDiv = document.getElementById('itensFirebase');
        listaDiv.innerHTML = "Carregando...";
        
        const q = query(collection(db, "assinaturas"), orderBy("dataVencimento", "asc"));
        const snapshot = await getDocs(q);
        listaDiv.innerHTML = "";

        snapshot.forEach((docSnap) => {
            const item = docSnap.data();
            const id = docSnap.id;
            listaDiv.innerHTML += `
                <div class="item">
                    <strong>${item.nome}</strong><br>
                    📅 ${item.dataVencimento} às ⏰ ${item.horaAlerta}
                    <div class="controles">
                        <button class="btn-editar" onclick="prepararEdicao('${id}', '${item.nome}', '${item.dataVencimento}', '${item.horaAlerta}')">Editar</button>
                        <button class="btn-excluir" onclick="excluir('${id}')">Remover</button>
                    </div>
                </div>`;
        });
    }

    window.excluir = async (id) => {
        if(confirm("Deseja remover este alerta?")) {
            await deleteDoc(doc(db, "assinaturas", id));
            exibirAssinaturas();
        }
    }

    window.prepararEdicao = (id, nome, data, hora) => {
        document.getElementById('idEdicao').value = id;
        document.getElementById('servico').value = nome;
        document.getElementById('dataVenc').value = data;
        document.getElementById('horaAlerta').value = hora;
        document.getElementById('btnSalvar').innerText = "Atualizar Alerta";
        window.scrollTo(0,0);
    }

    function limparCampos() {
        document.getElementById('servico').value = "";
        document.getElementById('dataVenc').value = "";
        document.getElementById('idEdicao').value = "";
    }

    document.getElementById('btnSalvar').addEventListener('click', salvar);
    window.onload = exibirAssinaturas;
</script>
</body>
</html>
