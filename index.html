<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Avisa Cancelamento - Stop Pay</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #e63946; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #e63946; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .lista { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
        .item { background: #fff5f5; padding: 10px; border-radius: 5px; margin-bottom: 5px; font-size: 14px; border-left: 4px solid #e63946; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚫 Stop Pay</h2>
    <input type="text" id="servico" placeholder="Nome da Assinatura (ex: Netflix)">
    <label>Vencimento:</label>
    <input type="date" id="dataVenc">
    <button id="btnAgendar">Agendar Alerta</button>

    <div class="lista" id="listaAssinaturas">
        <h3>Suas Assinaturas:</h3>
        <div id="itensFirebase">Carregando assinaturas...</div>
    </div>
</div>

<script type="module">
    // IMPORTANTE: Importando o Firebase do jeito certo para Web
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Suas credenciais que você me passou
    const firebaseConfig = {
      apiKey: "AIzaSyCvb_5kfqZ0TcvqqXYJ3H0zje7lkxg5KT0",
      authDomain: "stop-pay.firebaseapp.com",
      projectId: "stop-pay",
      storageBucket: "stop-pay.firebasestorage.app",
      messagingSenderId: "924558165559",
      appId: "1:924558165559:web:f9cf09b70071bac7e7e1b2",
      measurementId: "G-FVRE5N3LGL"
    };

    // Inicializa o Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // FUNÇÃO PARA SALVAR NO FIREBASE
    async function agendar() {
        const nome = document.getElementById('servico').value;
        const data = document.getElementById('dataVenc').value;

        if(!nome || !data) return alert("Preencha tudo!");

        try {
            // Salva na coleção "assinaturas" que você criou no Firebase
            await addDoc(collection(db, "assinaturas"), {
                nome: nome,
                dataVencimento: data,
                criadoEm: new Date()
            });

            alert("Sucesso! O robô do Telegram vai te avisar no dia.");
            document.getElementById('servico').value = "";
            document.getElementById('dataVenc').value = "";
            
            exibirAssinaturas(); // Atualiza a lista na tela

        } catch (e) {
            console.error("Erro ao salvar no Banco: ", e);
            alert("Erro ao salvar. Verifique se o Banco de Dados está em 'Modo de Teste'.");
        }
    }

    // FUNÇÃO PARA BUSCAR E EXIBIR AS ASSINATURAS DO BANCO
    async function exibirAssinaturas() {
        const listaDiv = document.getElementById('itensFirebase');
        listaDiv.innerHTML = "Carregando...";

        try {
            const q = query(collection(db, "assinaturas"), orderBy("dataVencimento", "asc"));
            const querySnapshot = await getDocs(q);
            
            listaDiv.innerHTML = ""; // Limpa para recarregar

            if (querySnapshot.empty) {
                listaDiv.innerHTML = "<p>Nenhuma assinatura cadastrada.</p>";
                return;
            }

            querySnapshot.forEach((doc) => {
                const item = doc.data();
                listaDiv.innerHTML += `
                    <div class="item">
                        <strong>${item.nome}</strong> - Vence: ${item.dataVencimento}
                    </div>`;
            });
        } catch (e) {
            console.error("Erro ao buscar dados: ", e);
            listaDiv.innerHTML = "Erro ao carregar assinaturas.";
        }
    }

    // Configura o clique do botão
    document.getElementById('btnAgendar').addEventListener('click', agendar);

    // Carrega a lista assim que abrir a página
    window.onload = exibirAssinaturas;

    // Registro do Service Worker (Opcional para PWA)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
</script>
</body>
</html>
