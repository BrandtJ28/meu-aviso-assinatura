<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Robô de Verificação - Stop Pay</title>
</head>
<body>
    <h2 id="status">Verificando agendamentos agora...</h2>
    <div id="log"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCvb_5kfqZ0TcvqqXYJ3H0zje7lkxg5KT0",
          authDomain: "stop-pay.firebaseapp.com",
          projectId: "stop-pay",
          storageBucket: "stop-pay.firebasestorage.app",
          messagingSenderId: "924558165559",
          appId: "1:924558165559:web:f9cf09b70071bac7e7e1b2",
          measurementId: "G-FVRE5N3LGL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // CONFIGURAÇÃO DO SEU TELEGRAM
        const TELEGRAM_TOKEN = "COLE_AQUI_SEU_TOKEN";
        const TELEGRAM_CHAT_ID = "COLE_AQUI_SEU_ID";

        async function rodarVerificador() {
            const agora = new Date();
            // Pega data (YYYY-MM-DD) e hora (HH:mm) local
            const hoje = agora.toLocaleDateString('en-CA'); 
            const horaAtual = agora.getHours().toString().padStart(2, '0') + ":" + 
                              agora.getMinutes().toString().padStart(2, '0');

            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<p>Checando: ${hoje} às ${horaAtual}</p>`;

            try {
                // Busca contas que vencem HOJE
                const q = query(collection(db, "assinaturas"), where("dataVencimento", "==", hoje));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    document.getElementById('status').innerText = "Nada para hoje.";
                    return;
                }

                snapshot.forEach(async (doc) => {
                    const conta = doc.data();
                    
                    // SÓ ENVIA SE O HORÁRIO BATER (ou se já passou do horário e estamos na mesma hora)
                    if (conta.horaAlerta === horaAtual) {
                        const msg = `⏰ *HORA DE CANCELAR!*%0A%0A📌 *Serviço:* ${conta.nome}%0A💰 *Valor:* R$ ${conta.valor || '---'}%0A🔔 *Alerta programado para:* ${conta.horaAlerta}`;
                        
                        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${msg}&parse_mode=Markdown`);
                        logDiv.innerHTML += `<p style="color:green">✅ Aviso enviado: ${conta.nome}</p>`;
                    } else {
                        logDiv.innerHTML += `<p style="color:orange">⏳ ${conta.nome} agendado para ${conta.horaAlerta} (Aguardando...)</p>`;
                    }
                });

                document.getElementById('status').innerText = "Verificação de minuto concluída.";
            } catch (e) {
                console.error(e);
                document.getElementById('status').innerText = "Erro ao ler banco.";
            }
        }

        // Executa assim que a página abre
        rodarVerificador();
    </script>
</body>
</html>
