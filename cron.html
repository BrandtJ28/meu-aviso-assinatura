<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Verificador Stop Pay - Telegram</title>
</head>
<body>
    <h2 id="status">Verificando vencimentos...</h2>
    <ul id="lista"></ul>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Suas configurações do Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyCvb_5kfqZ0TcvqqXYJ3H0zje7lkxg5KT0",
          authDomain: "stop-pay.firebaseapp.com",
          projectId: "stop-pay",
          storageBucket: "stop-pay.firebasestorage.app",
          messagingSenderId: "924558165559",
          appId: "1:924558165559:web:f9cf09b70071bac7e7e1b2",
          measurementId: "G-FVRE5N3LGL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // CONFIGURAÇÃO DO TELEGRAM (SUBSTITUA AQUI)
        const TELEGRAM_TOKEN = "COLE_AQUI_O_TOKEN_DO_BOTFATHER";
        const TELEGRAM_CHAT_ID = "COLE_AQUI_O_ID_DO_USERINFOBOT";

        async function verificarVencimentos() {
            try {
                // Ajuste para pegar a data correta no fuso horário local (Brasil)
                const hoje = new Date().toLocaleDateString('en-CA'); // Formato YYYY-MM-DD
                const status = document.getElementById('status');
                
                const q = query(collection(db, "assinaturas"), where("dataVencimento", "==", hoje));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    status.innerText = "Nenhuma conta vence hoje (" + hoje + ").";
                    return;
                }

                querySnapshot.forEach(async (doc) => {
                    const conta = doc.data();
                    
                    // Exibe na página
                    const li = document.createElement('li');
                    li.innerText = `ALERTA: A conta ${conta.nome} vence hoje!`;
                    document.getElementById('lista').appendChild(li);

                    // Envia para o Telegram
                    const mensagem = `🚨 *ALERTA DE VENCIMENTO* 🚨%0A%0A📌 *Conta:* ${conta.nome}%0A💰 *Valor:* R$ ${conta.valor || 'Não informado'}%0A📅 *Vence hoje:* ${hoje}`;
                    
                    try {
                        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${mensagem}&parse_mode=Markdown`);
                        console.log("Mensagem enviada para: " + conta.nome);
                    } catch (err) {
                        console.error("Erro ao enviar Telegram:", err);
                    }
                });

                status.innerText = "Verificação concluída! Avisos enviados.";
                
            } catch (error) {
                console.error("Erro ao buscar:", error);
                document.getElementById('status').innerText = "Erro ao verificar banco de dados.";
            }
        }

        verificarVencimentos();
    </script>
</body>
</html>
